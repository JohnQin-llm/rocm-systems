<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="Composing one prediction: three softmax variants"><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/></filter></defs><rect x="1" y="1" width="1198" height="468" rx="22" fill="#ffffff" stroke="#e2e8f0"/><text x="34" y="44" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#0f172a">Composing one prediction: three softmax variants</text><text x="34" y="66" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">Held-out set 5, 2048×3584. Terms in µs under one knob set (fit s1); hardware is the median of 3 guarded runs.</text><rect x="34" y="84" width="51" height="22" rx="11.0" fill="#64748b" stroke="#64748b" stroke-width="0"/><text x="59.5" y="99.5" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">fixed</text><rect x="95.0" y="84" width="229" height="22" rx="11.0" fill="#2563eb" stroke="#2563eb" stroke-width="0"/><text x="209.6" y="99.5" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">max(issue, bandwidth, placement)</text><rect x="334.2" y="84" width="64" height="22" rx="11.0" fill="#7c3aed" stroke="#7c3aed" stroke-width="0"/><text x="366.3" y="99.5" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">latency</text><rect x="408.4" y="84" width="64" height="22" rx="11.0" fill="#0d9488" stroke="#0d9488" stroke-width="0"/><text x="440.5" y="99.5" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">filling</text><rect x="482.59999999999997" y="84" width="51" height="22" rx="11.0" fill="#d97706" stroke="#d97706" stroke-width="0"/><text x="508.1" y="99.5" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">flush</text><rect x="553.5999999999999" y="84" width="71" height="22" rx="11.0" fill="#0f172a" stroke="#0f172a" stroke-width="0"/><text x="589.0" y="99.5" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">hardware</text><text x="34.0" y="150.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">2 warps · 1 row/program · .wt</text><text x="34.0" y="168.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">w2_r1_c2 · rank: model 1, hardware 1</text><rect x="330.0" y="136" width="19.0" height="30" fill="#64748b" fill-opacity="0.85" stroke="#ffffff" stroke-width="1"/><rect x="349.0" y="136" width="62.9" height="30" fill="#2563eb" fill-opacity="0.85" stroke="#ffffff" stroke-width="1"/><text x="380.5" y="155.5" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3.93</text><rect x="411.9" y="136" width="50.7" height="30" fill="#7c3aed" fill-opacity="0.85" stroke="#ffffff" stroke-width="1"/><text x="437.3" y="155.5" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3.17</text><rect x="462.6" y="136" width="10.4" height="30" fill="#0d9488" fill-opacity="0.85" stroke="#ffffff" stroke-width="1"/><text x="481.0" y="156.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#0f172a" text-anchor="start">8.94 µs</text><rect x="330" y="174" width="135.4" height="12" rx="3" fill="#0f172a" fill-opacity="0.75"/><text x="473.4" y="184.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">8.46 µs</text><text x="34.0" y="242.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">2 warps · 1 row/program · plain</text><text x="34.0" y="260.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">w2_r1_c0 · rank: model 2, hardware 2</text><rect x="330.0" y="228" width="19.0" height="30" fill="#64748b" fill-opacity="0.85" stroke="#ffffff" stroke-width="1"/><rect x="349.0" y="228" width="31.7" height="30" fill="#2563eb" fill-opacity="0.85" stroke="#ffffff" stroke-width="1"/><rect x="380.7" y="228" width="50.7" height="30" fill="#7c3aed" fill-opacity="0.85" stroke="#ffffff" stroke-width="1"/><text x="406.1" y="247.5" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3.17</text><rect x="431.4" y="228" width="10.4" height="30" fill="#0d9488" fill-opacity="0.85" stroke="#ffffff" stroke-width="1"/><rect x="441.8" y="228" width="124.6" height="30" fill="#d97706" fill-opacity="0.85" stroke="#ffffff" stroke-width="1"/><text x="504.2" y="247.5" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">7.79</text><text x="574.5" y="248.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#0f172a" text-anchor="start">14.78 µs</text><rect x="330" y="266" width="164.3" height="12" rx="3" fill="#0f172a" fill-opacity="0.75"/><text x="502.3" y="276.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">10.27 µs</text><text x="34.0" y="334.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">1 warp · 8 rows/program · plain</text><text x="34.0" y="352.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">w1_r8_c0 · rank: model 3, hardware 3</text><rect x="330.0" y="320" width="19.0" height="30" fill="#64748b" fill-opacity="0.85" stroke="#ffffff" stroke-width="1"/><rect x="349.0" y="320" width="31.7" height="30" fill="#2563eb" fill-opacity="0.85" stroke="#ffffff" stroke-width="1"/><rect x="380.7" y="320" width="575.4" height="30" fill="#7c3aed" fill-opacity="0.85" stroke="#ffffff" stroke-width="1"/><text x="668.4" y="339.5" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">35.96</text><rect x="956.1" y="320" width="10.4" height="30" fill="#0d9488" fill-opacity="0.85" stroke="#ffffff" stroke-width="1"/><rect x="966.5" y="320" width="124.3" height="30" fill="#d97706" fill-opacity="0.85" stroke="#ffffff" stroke-width="1"/><text x="1028.6" y="339.5" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">7.77</text><text x="1098.8" y="340.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#0f172a" text-anchor="start">47.55 µs</text><rect x="330" y="358" width="423.4" height="12" rx="3" fill="#0f172a" fill-opacity="0.75"/><text x="761.4" y="368.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">26.46 µs</text><text x="34.0" y="428.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">Same code except the store: .wt moves its output during the kernel (bandwidth up) and leaves nothing to flush.</text><text x="34.0" y="450.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">8 rows per program: one wavefront per CU, nothing hides its stalls, so latency grows 11×.</text></svg>
