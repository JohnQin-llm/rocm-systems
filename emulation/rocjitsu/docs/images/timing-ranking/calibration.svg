<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="580" viewBox="0 0 1300 580" role="img" aria-label="Two-stage calibration and the cost of one dispatch"><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/></filter><marker id="m-059669" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="m-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="m-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="m-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="m-d97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect x="1" y="1" width="1298" height="578" rx="22" fill="#ffffff" stroke="#e2e8f0"/><text x="34" y="44" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#0f172a">Two-stage calibration and the cost of one dispatch</text><text x="34" y="66" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">Stage 1 fixes absolute time; stage 2 fixes which variant wins; the composition below is what both stages tune.</text><g filter="url(#shadow)"><path d="M40,110 a125.0,10 0 0,1 250,0 v72 a125.0,10 0 0,1 -250,0 z" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6" stroke-width="1.3"/></g><ellipse cx="165.0" cy="110" rx="125.0" ry="10" fill="#f1f5f9" stroke="#64748b" strok