<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-label="Memory hierarchy and write policy"><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/></filter><marker id="m-0d9488" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="m-4f46e5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker><marker id="m-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="m-94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="m-d97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect x="1" y="1" width="1198" height="738" rx="22" fill="#ffffff" stroke="#e2e8f0"/><text x="34" y="44" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#0f172a">Memory hierarchy and write policy</text><text x="34" y="66" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">One request per memory instruction; each level serves its hits and passes its misses on.</text><g filter="url(#shadow)"><rect x="50" y="100" width="640" height="58" rx="12" fill="#ffffff" stroke="#64748b" stroke-opacity="0.45" stroke-width="1.2"/></g><rect x="50" y="110" width="5" height="38" rx="2.5" fill="#64748b"/><text x="68.0" y="124.5" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial,