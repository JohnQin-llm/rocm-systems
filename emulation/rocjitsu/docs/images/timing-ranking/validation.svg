<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="340" viewBox="0 0 1300 340" role="img" aria-label="How every claim is validated"><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/></filter><marker id="m-059669" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="m-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="m-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="m-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="m-94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="1" y="1" width="1298" height="338" rx="22" fill="#ffffff" stroke="#e2e8f0"/><text x="34" y="44" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#0f172a">How every claim is validated</text><text x="34" y="66" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">Each model or calibration change is pre-registered, tested on a held-out set nobody has seen, and scored once.</text><g filter="url(#shadow)"><rect x="40" y="110" width="220" height="110" rx="12" fill="#ffffff" stroke="#64748b" stroke-opacity="0.45" stroke-width="1.2"/></g><rect x="40" y="120" width="5" height="90" rx="2.5" fill="#64748b"/><text x="58.0" y="152.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#334155" text-anchor="start">Develop</text><text x="58.0" y="171.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">fit and diagnose on</text><text x="58.0" y="187.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">seen data only</text><circle cx="234" cy="136" r="14" fill="#64748b"/><text x="234.0" y="141.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><path d="M262.0,165.0 L288.0,165.0" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#m-64748b)"/><g filter="url(#shadow)"><rect x="290" y="110" width="220" height="110" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.45" stroke-width="1.2"/></g><rect x="290" y="120" width="5" height="90" rx="2.5" fill="#7c3aed"/><text x="308.0" y="152.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#4c1d95" text-anchor="start">Pre-register</text><text x="308.0" y="171.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">model, knobs, rules;</text><text x="308.0" y="187.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">sha256, committed</text><circle cx="484" cy="136" r="14" fill="#7c3aed"/><text x="484.0" y="141.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><path d="M512.0,165.0 L538.0,165.0" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#m-7c3aed)"/><g filter="url(#shadow)"><rect x="540" y="110" width="220" height="110" rx="12" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.45" stroke-width="1.2"/></g><rect x="540" y="120" width="5" height="90" rx="2.5" fill="#2563eb"/><text x="558.0" y="152.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1e3a8a" text-anchor="start">Measure</text><text x="558.0" y="171.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">a new held-out set,</text><text x="558.0" y="187.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">gpu_guard, 3 runs</text><circle cx="734" cy="136" r="14" fill="#2563eb"/><text x="734.0" y="141.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><path d="M762.0,165.0 L788.0,165.0" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#m-2563eb)"/><g filter="url(#shadow)"><rect x="790" y="110" width="220" height="110" rx="12" fill="#ffffff" stroke="#059669" stroke-opacity="0.45" stroke-width="1.2"/></g><rect x="790" y="120" width="5" height="90" rx="2.5" fill="#059669"/><text x="808.0" y="152.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#064e3b" text-anchor="start">Score once</text><text x="808.0" y="171.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">prereg_score.py;</text><text x="808.0" y="187.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">pass or fail, reported</text><circle cx="984" cy="136" r="14" fill="#059669"/><text x="984.0" y="141.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><path d="M1012.0,165.0 L1038.0,165.0" fill="none" stroke="#059669" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#m-059669)"/><g filter="url(#shadow)"><rect x="1040" y="110" width="220" height="110" rx="12" fill="#ffffff" stroke="#d97706" stroke-opacity="0.45" stroke-width="1.2"/></g><rect x="1040" y="120" width="5" height="90" rx="2.5" fill="#d97706"/><text x="1058.0" y="152.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#78350f" text-anchor="start">Retire</text><text x="1058.0" y="171.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">the set joins the</text><text x="1058.0" y="187.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">development data</text><circle cx="1234" cy="136" r="14" fill="#d97706"/><text x="1234.0" y="141.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">5</text><path d="M1190,222 C1190,300 150,300 150,224" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#m-94a3b8)"/><text x="670.0" y="292.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">next change starts from the larger development set</text></svg>
