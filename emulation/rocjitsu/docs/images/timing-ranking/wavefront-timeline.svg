<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="Life of a wavefront"><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/></filter><marker id="m-0d9488" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="m-d97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect x="1" y="1" width="1198" height="478" rx="22" fill="#ffffff" stroke="#e2e8f0"/><text x="34" y="44" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#0f172a">Life of a wavefront</text><text x="34" y="66" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">Each wavefront has its own clock. A memory request runs in the background; s_waitcnt is where its latency shows.</text><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fffbeb"/><line x1="0" y1="0" x2="0" y2="8" stroke="#f59e0b" stroke-width="3" stroke-opacity="0.45"/></pattern></defs><text x="34.0" y="130.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">wavefront A</text><text x="34.0" y="147.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">one CU</text><text x="34.0" y="218.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">A's load request</text><text x="34.0" y="235.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">through the hierarchy</text><text x="34.0" y="306.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">wavefront B</text><text x="34.0" y="323.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">same CU, resident</text><rect x="190" y="112" width="80" height="44" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/><text x="230.0" y="138.3" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">v_mul</text><rect x="270" y="112" width="100" height="44" rx="7" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.3"/><text x="320.0" y="138.3" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#134e4a" text-anchor="middle">global_load</text><rect x="370" y="112" width="170" height="44" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.3"/><text x="455.0" y="138.3" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#4c1d95" text-anchor="middle">v_mfma × 2</text><rect x="860" y="112" width="100" height="44" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/><text x="910.0" y="138.3" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">v_add</text><rect x="960" y="112" width="120" height="44" rx="7" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.3"/><text x="1020.0" y="138.3" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#134e4a" text-anchor="middle">global_store</text><rect x="540" y="112" width="320" height="44" rx="7" fill="url(#hatch)" stroke="#d97706" stroke-width="1.3"/><text x="700.0" y="138.3" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#78350f" text-anchor="middle">s_waitcnt vmcnt(0) · stall</text><rect x="370" y="206" width="70" height="32" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/><text x="405.0" y="226.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">L1 miss</text><rect x="440" y="206" width="90" height="32" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/><text x="485.0" y="226.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">L2 miss</text><rect x="530" y="206" width="60" height="32" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/><text x="560.0" y="226.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">fabric</text><rect x="590" y="206" width="90" height="32" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/><text x="635.0" y="226.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">MALL miss</text><rect x="680" y="206" width="180" height="32" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/><text x="770.0" y="226.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">HBM</text><rect x="540" y="288" width="100" height="44" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.3"/><text x="590.0" y="314.3" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#4c1d95" text-anchor="middle">v_mfma</text><rect x="640" y="288" width="90" height="44" rx="7" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.3"/><text x="685.0" y="314.3" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#312e81" text-anchor="middle">ds_read</text><rect x="730" y="288" width="120" height="44" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.3"/><text x="790.0" y="314.3" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#4c1d95" text-anchor="middle">v_mfma</text><path d="M320.0,158.0 L320.0,220.0 L366.0,220.0" fill="none" stroke="#0d9488" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m-0d9488)"/><path d="M860.0,204.0 L860.0,160.0" fill="none" stroke="#d97706" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#m-d97706)"/><text x="870.0" y="192.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="start">data arrives</text><text x="700.0" y="266.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">each level: hit latency + queueing; misses go on</text><text x="695.0" y="352.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#4c1d95" text-anchor="middle">B issues while A waits: part of A's stall is hidden</text><path d="M190,382 v-8 M190,382 H1080 M1080,382 v-8" fill="none" stroke="#0f172a" stroke-width="1.4"/><text x="635.0" y="402.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">critical path of A = its issue time + its stalls</text><text x="34.0" y="436.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">issue term: work queued on each port of the busiest CU, over all its wavefronts.</text><text x="34.0" y="458.0" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">latency term: critical path − what the other resident wavefronts hide, × rounds of wavefronts.</text></svg>
